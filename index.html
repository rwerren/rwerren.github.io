<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RWERREN.COM</title>

<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    background:
    radial-gradient(
        circle at top,
        #0b3d6e 0%,
        #081624 40%,
        #050505 100%
    );

    font-family:Arial, Helvetica, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:900px;
    text-align:center;
}

.logo{
    width:450px;
    max-width:90%;
    margin-bottom:30px;
}

h1{
    font-family:'Audiowide', sans-serif;
    color:white;
    font-size:3rem;
    letter-spacing:4px;
    margin-bottom:15px;
    text-shadow:0 0 15px rgba(0,140,255,0.5);
}

.subtitle{
    color:#9ccfff;
    font-size:1.1rem;
    margin-bottom:50px;
    letter-spacing:1px;
}

.buttons{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.btn{
    width:340px;
    padding:18px;

    font-family:'Audiowide', sans-serif;
    font-size:1rem;
    letter-spacing:1px;

    text-decoration:none;
    color:white;

    background:linear-gradient(
        135deg,
        #0d5db8,
        #008cff
    );

    border:1px solid rgba(255,255,255,0.25);
    border-radius:12px;

    box-shadow:0 0 20px rgba(0,140,255,0.25);

    transition:all 0.25s ease;
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:0 0 30px rgba(0,140,255,0.6);
}

footer{
    margin-top:40px;
    color:#6faee6;
    font-size:0.9rem;
    letter-spacing:1px;
}

</style>
</head>

<body>

<div class="container">

    <img src="images/Logo.png" alt="RW Logo" class="logo">

    <h1>RWERREN.COM</h1>

    <div class="subtitle">
        ROBERT WERREN PRESENTS
    </div>

    <div class="buttons">

        <a class="btn" href="/teigtaschen/">
            TEIGTASCHEN
        </a>

        <a class="btn" href="/zmittag/">
            ZMITTAG IM AARGAU
        </a>

        <a class="btn" href="/newsletter/">
            NEWSLETTER
        </a>

    </div>

    <footer>
        © Robert Werren
    </footer>

</div>

</body>
</html>
