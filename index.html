<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robert Werren</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 60px;
      letter-spacing: 3px;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    a {
      text-decoration: none;
    }

    button {
      padding: 18px 36px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: white;
      color: black;
      transition: 0.2s ease;
      font-weight: bold;
    }

    button:hover {
      transform: scale(1.05);
      background: #ddd;
    }
  </style>
</head>

<body>

  <h1>ROBERT WERREN PRESENTS</h1>

  <div class="buttons">

    <a href="/teigtaschen/">
      <button>TEIGTASCHEN</button>
    </a>

    <a href="/zmittag/">
      <button>ZMITTAG IM AARGAU</button>
    </a>

    <a href="/newsletter/">
      <button>NEWSLETTER</button>
    </a>

  </div>

</body>
</html>
