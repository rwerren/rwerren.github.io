<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RWERREN.COM</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    background:
    radial-gradient(circle at top,
    #0b3d6e 0%,
    #081624 40%,
    #000000 100%);

    font-family:Arial, Helvetica, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    max-width:900px;
    text-align:center;
    padding:30px 20px;
}

.logo{
    width:min(420px,85vw);
    height:auto;
    margin-bottom:20px;
}

h1{
    color:white;
    font-size:clamp(2.2rem,8vw,5rem);
    letter-spacing:4px;
    text-shadow:
    0 0 10px #00aaff,
    0 0 25px #00aaff;
    margin-bottom:15px;
}

.subtitle{
    color:#d6e9ff;
    font-size:clamp(1rem,3vw,2rem);
    letter-spacing:4px;
    margin-bottom:60px;
}

.buttons{
    width:100%;
    max-width:650px;
    margin:0 auto;

    display:flex;
    flex-direction:column;
    gap:30px;
}

.button{
    display:block;

    width:100%;

    padding:28px;

    background:
    linear-gradient(
    135deg,
    #1878ff,
    #1aa8ff);

    color:white;

    text-decoration:none;

    font-size:clamp(1.2rem,4vw,2rem);

    font-weight:bold;

    border-radius:20px;

    border:1px solid rgba(255,255,255,0.25);

    box-shadow:
    0 0 15px rgba(0,170,255,0.5),
    0 0 40px rgba(0,170,255,0.25);

    transition:0.25s;
}

.button:hover{
    transform:translateY(-3px);
}

.footer{
    margin-top:60px;

    color:#b7d8ff;

    font-size:1.3rem;
}

@media (max-width:600px){

    .logo{
        width:90vw;
    }

    .subtitle{
        margin-bottom:40px;
    }

    .button{
        padding:24px;
        border-radius:18px;
    }

    .footer{
        font-size:1rem;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <img src="images/Logo.png" alt="RWERREN.COM" class="logo">

    <h1>RWERREN.COM</h1>

    <div class="subtitle">
        ROBERT WERREN PRESENTS
    </div>

    <div class="buttons">

        <a href="/teigtaschen/" class="button">
            TEIGTASCHEN
        </a>

        <a href="/zmittag/" class="button">
            ZMITTAG IM AARGAU
        </a>

        <a href="/newsletter/" class="button">
            NEWSLETTER
        </a>

    </div>

    <div class="footer">
        © Robert Werren
    </div>

</div>

</body>
</html>
