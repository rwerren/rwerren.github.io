<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RWERREN.COM</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/Logo.png">
<link rel="icon" href="images/Logo.png">
<meta name="theme-color" content="#081a30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    min-height:100dvh;

    background:
    radial-gradient(circle at 50% 0%,
    #0d4a8a 0%,
    #081a30 45%,
    #000000 100%);

    background-attachment:fixed;

    font-family:Arial, Helvetica, sans-serif;

    display:flex;

    overflow-x:hidden;
    position:relative;
}

/* Background grid */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(0,170,255,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,170,255,0.08) 1px, transparent 1px);

    background-size:48px 48px;

    mask-image:radial-gradient(circle at 50% 20%, #000 0%, transparent 75%);
    -webkit-mask-image:radial-gradient(circle at 50% 20%, #000 0%, transparent 75%);

    pointer-events:none;
    z-index:0;
}

/* Content */

.container{
    position:relative;
    z-index:1;

    width:100%;
    max-width:520px;
    text-align:center;
    padding:40px 20px;

    /* centered when it fits, scrollable from the top when it doesn't */
    margin:auto;
}

.logo{
    width:min(220px,55vw);
    height:auto;
    margin-bottom:10px;

    filter:drop-shadow(0 0 18px rgba(0,170,255,0.55));

    animation:pulse-logo 4s ease-in-out infinite;
}

@keyframes pulse-logo{
    0%,100%{ filter:drop-shadow(0 0 18px rgba(0,170,255,0.55)); }
    50%{ filter:drop-shadow(0 0 32px rgba(0,170,255,0.85)); }
}

h1{
    font-family:'Audiowide', sans-serif;
    color:#000000;

    font-size:clamp(1.8rem,7vw,3.2rem);

    letter-spacing:3px;

    text-shadow:
    0 0 15px #00aaff,
    0 0 35px #00aaff,
    0 0 60px #00aaff;

    margin-bottom:10px;
}

.subtitle{
    font-family:'Audiowide', sans-serif;

    color:#8fc1ef;

    font-size:clamp(0.75rem,2.6vw,1.1rem);

    letter-spacing:3px;

    margin-bottom:36px;
}

/* Hero card: Pints */

.hero-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;

    padding:34px 24px;
    margin-bottom:20px;

    background:linear-gradient(160deg, rgba(0,170,255,0.22), rgba(0,60,110,0.10));

    border:1px solid rgba(0,170,255,0.55);
    border-radius:22px;

    text-decoration:none;

    box-shadow:0 0 30px rgba(0,170,255,0.25), inset 0 0 30px rgba(0,170,255,0.06);

    transition:0.25s;

    position:relative;
    overflow:hidden;
}

.hero-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 0%, rgba(0,200,255,0.25), transparent 60%);
    pointer-events:none;
}

.hero-card:hover{
    border-color:rgba(0,200,255,0.9);
    box-shadow:0 0 42px rgba(0,200,255,0.4), inset 0 0 30px rgba(0,170,255,0.1);
    transform:translateY(-2px);
}

.hero-icon{
    font-size:2.6rem;
    line-height:1;
}

.hero-title{
    font-family:'Audiowide', sans-serif;
    color:#eaf6ff;
    font-size:clamp(1.4rem,6vw,1.9rem);
    letter-spacing:3px;

    text-shadow:0 0 18px rgba(0,200,255,0.6);
}

.hero-sub{
    font-family:Arial, Helvetica, sans-serif;
    color:#a9d7fb;
    font-size:0.85rem;
    letter-spacing:0.5px;
    text-align:center;
}

.hero-cta{
    margin-top:6px;

    font-family:'Audiowide', sans-serif;
    font-size:0.75rem;
    letter-spacing:2px;
    color:#00121f;

    background:#4fd0ff;
    padding:10px 26px;
    border-radius:999px;

    box-shadow:0 0 18px rgba(0,200,255,0.5);
}

/* Tutorials: collapsible card */

.tut-card{
    margin-bottom:28px;

    background:linear-gradient(135deg, rgba(0,170,255,0.10), rgba(255,255,255,0.02));

    border:1px solid rgba(0,170,255,0.35);
    border-radius:16px;

    box-shadow:0 4px 20px rgba(0,0,0,0.35);

    overflow:hidden;
    transition:border-color 0.25s, box-shadow 0.25s;
}

.tut-card:hover,
.tut-card.open{
    border-color:rgba(0,170,255,0.7);
    box-shadow:0 4px 28px rgba(0,170,255,0.25);
}

.tut-toggle{
    display:flex;
    align-items:center;
    gap:14px;

    width:100%;
    padding:14px 18px;

    background:none;
    border:none;
    cursor:pointer;

    font-family:'Audiowide', sans-serif;
    color:#eaf6ff;
    font-size:0.95rem;
    letter-spacing:1.5px;
    text-align:left;
}

.tut-icon{
    font-size:1.3rem;
    line-height:1;
}

.tut-text{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.tut-text small{
    font-family:Arial, Helvetica, sans-serif;
    letter-spacing:0.3px;
    color:#8fc1ef;
    font-size:0.72rem;
}

.tut-arrow{
    color:#4fa9e8;
    transition:transform 0.25s;
}

.tut-card.open .tut-arrow{
    transform:rotate(90deg);
}

.tut-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.35s ease;
}

.tut-card.open .tut-body{
    border-top:1px solid rgba(0,170,255,0.15);
}

/* Carousel */

.carousel{
    position:relative;
    padding:16px 0 14px;
}

.carousel-track{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    scrollbar-width:none;
}

.carousel-track::-webkit-scrollbar{
    display:none;
}

.slide{
    flex:0 0 100%;
    scroll-snap-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.slide video{
    height:min(60vh, 480px);
    aspect-ratio:780 / 1688;
    max-width:calc(100% - 100px);

    background:#000;
    border-radius:14px;
    border:1px solid rgba(0,170,255,0.35);
    box-shadow:0 0 22px rgba(0,170,255,0.25);
}

.slide-title{
    font-family:'Audiowide', sans-serif;
    color:#eaf6ff;
    font-size:0.85rem;
    letter-spacing:1.5px;
}

.carousel-btn{
    position:absolute;
    top:calc(16px + min(60vh, 480px) / 2);
    transform:translateY(-50%);

    width:38px;
    height:38px;
    border-radius:50%;

    background:rgba(0,30,60,0.75);
    border:1px solid rgba(0,170,255,0.5);
    color:#4fd0ff;
    font-size:1.3rem;
    line-height:1;
    cursor:pointer;

    transition:0.2s;
}

.carousel-btn:hover{
    background:rgba(0,170,255,0.25);
}

.carousel-btn:disabled{
    opacity:0.25;
    cursor:default;
}

.carousel-btn.prev{ left:10px; }
.carousel-btn.next{ right:10px; }

.carousel-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:12px;
}

.carousel-dots button{
    width:8px;
    height:8px;
    padding:0;
    border-radius:50%;
    border:none;
    background:rgba(0,170,255,0.3);
    cursor:pointer;
    transition:0.2s;
}

.carousel-dots button.active{
    background:#4fd0ff;
    box-shadow:0 0 8px rgba(0,200,255,0.8);
    transform:scale(1.25);
}

.footer{
    font-family:'Audiowide', sans-serif;

    margin-top:10px;

    color:#5c8ab8;

    font-size:0.85rem;

    letter-spacing:1px;
}

</style>
</head>

<body>

<!-- Content -->

<div class="container">

    <img src="images/Logo.png"
         alt="RWERREN.COM"
         class="logo">

    <h1>RWERREN.COM</h1>

    <div class="subtitle">
        ROBERT WERREN PRESENTS
    </div>

    <a class="hero-card" href="https://pints.rwerren.com" target="_blank" rel="noopener">
        <span class="hero-icon">🍺</span>
        <span class="hero-title">PINTS</span>
        <span class="hero-sub">The beer rating game &mdash; collect, rate &amp; discover</span>
        <span class="hero-cta">PLAY NOW ›</span>
    </a>

    <div class="tut-card" id="tutCard">

        <button class="tut-toggle" id="tutToggle" aria-expanded="false" aria-controls="tutBody">
            <span class="tut-icon">🎬</span>
            <span class="tut-text">
                TUTORIALS
                <small>Learn how to play Pints</small>
            </span>
            <span class="tut-arrow">›</span>
        </button>

        <div class="tut-body" id="tutBody">
            <div class="carousel">

                <div class="carousel-track" id="tutTrack">

                    <div class="slide">
                        <video src="videos/Tutorial-Add-Pub.mp4#t=0.1" controls playsinline preload="metadata"></video>
                        <div class="slide-title">📍 ADD A PUB</div>
                    </div>

                    <div class="slide">
                        <video src="videos/Tutorial-Handshake.mp4#t=0.1" controls playsinline preload="metadata"></video>
                        <div class="slide-title">🤝 HANDSHAKE &amp; CHEERS</div>
                    </div>

                    <div class="slide">
                        <video src="videos/Tutorial-Beer-Photo.mp4#t=0.1" controls playsinline preload="metadata"></video>
                        <div class="slide-title">🛢️ BEER PHOTO XP</div>
                    </div>

                </div>

                <button class="carousel-btn prev" id="tutPrev" aria-label="Previous video">‹</button>
                <button class="carousel-btn next" id="tutNext" aria-label="Next video">›</button>

                <div class="carousel-dots" id="tutDots"></div>

            </div>
        </div>

    </div>

    <div class="footer">
        © Robert Werren
    </div>

</div>

<script>
(function () {
    const card   = document.getElementById('tutCard');
    const toggle = document.getElementById('tutToggle');
    const body   = document.getElementById('tutBody');
    const track  = document.getElementById('tutTrack');
    const prev   = document.getElementById('tutPrev');
    const next   = document.getElementById('tutNext');
    const dotBox = document.getElementById('tutDots');
    const slides = Array.from(track.children);
    const videos = slides.map(s => s.querySelector('video'));
    let current = 0;

    // Expand / collapse
    toggle.addEventListener('click', () => {
        const open = card.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open);
        if (open) {
            body.style.maxHeight = body.scrollHeight + 'px';
        } else {
            body.style.maxHeight = body.scrollHeight + 'px';   // from 'none' back to a number
            body.offsetHeight;                                 // force reflow
            body.style.maxHeight = '0';
            videos.forEach(v => v.pause());
        }
    });

    // After opening: release the limit so window resizes don't clip the carousel
    body.addEventListener('transitionend', () => {
        if (card.classList.contains('open')) body.style.maxHeight = 'none';
    });

    // Dots
    const dots = slides.map((_, i) => {
        const d = document.createElement('button');
        d.setAttribute('aria-label', 'Video ' + (i + 1));
        d.addEventListener('click', () => goTo(i));
        dotBox.appendChild(d);
        return d;
    });

    function goTo(i) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        track.scrollTo({ left: i * track.clientWidth });
    }

    function update() {
        const w = track.clientWidth;
        const i = w > 0 ? Math.round(track.scrollLeft / w) : current;
        if (i !== current) {
            videos[current].pause();
            current = i;
        }
        dots.forEach((d, k) => d.classList.toggle('active', k === current));
        prev.disabled = current === 0;
        next.disabled = current === slides.length - 1;
    }

    prev.addEventListener('click', () => goTo(current - 1));
    next.addEventListener('click', () => goTo(current + 1));
    track.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', () => goTo(current));

    // Only one video plays at a time
    videos.forEach(v => v.addEventListener('play', () => {
        videos.forEach(o => { if (o !== v) o.pause(); });
    }));

    update();
})();
</script>

</body>
</html>
